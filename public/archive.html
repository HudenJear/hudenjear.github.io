<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive - Reversal & Chrome</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="/" class="logo">
        <i class="fas fa-camera"></i>
        <div class="logo-text">
          <span class="logo-title">REVERSAL</span>
          <span class="logo-subtitle">& CHROME</span>
        </div>
      </a>
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="/#highlights">HIGHLIGHTS</a></li>
          <li><a href="/reversal-intro">COLOR REVERSAL FILMS</a></li>
          <li><a href="/#about">ABOUT</a></li>
          <li><a href="/film-library">FILM LIBRARY</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <section class="page-hero">
      <h1 class="page-title">Archive</h1>
      <p class="page-subtitle">Browse by format and month. Click a month to view all frames.</p>
      <a href="javascript:void(0)" class="back-btn" onclick="history.back()">
        <i class="fas fa-arrow-left"></i> 返回上一级
      </a>
      <a class="view-all-btn" href="/">BACK</a>
    </section>

    <section class="page-section">
      <div id="archive-container" class="archive-page"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-left">
        <div class="footer-brand">
          <i class="fas fa-camera"></i>
          <span>Reversal &amp; Chrome</span>
        </div>
        <p class="copyright">© REVERSAL &amp; CHROME 2024</p>
      </div>
    </div>
  </footer>

  <script>
    let manifest = null;

    function getPhotoUrl(photoId) {
      if (!manifest || !manifest.photos || !manifest.photos[photoId]) return '';
      return `static/imgs/${manifest.photos[photoId].file}`;
    }

    function goToArchiveMonth(format, month) {
      window.location.href = `/archive-month?format=${encodeURIComponent(format)}&month=${encodeURIComponent(month)}`;
    }

    function renderArchive() {
      const container = document.getElementById('archive-container');
      if (!container) return;
      const archive = manifest?.indexes?.archive;
      if (!archive) return;

      const formats = Object.keys(archive).sort();

      container.innerHTML = formats.map(format => {
        const months = archive[format] || {};
        const monthKeys = Object.keys(months).sort().reverse();

        const monthCards = monthKeys.map(month => {
          const photoIds = months[month];
          if (!Array.isArray(photoIds) || photoIds.length === 0) return '';
          const coverId = photoIds[0];
          const url = getPhotoUrl(coverId);
          const label = `${format} ${month}`;

          return `
            <div class="archive-month-card" onclick='goToArchiveMonth(${JSON.stringify(format)}, ${JSON.stringify(month)})'>
              <div class="archive-month-image">
                <img src="${url}" alt="${label}" loading="lazy">
              </div>
              <div class="archive-month-meta">
                <div class="archive-month-month">${month}</div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="archive-format-row">
            <h2 class="archive-format-title">${format}</h2>
            <div class="archive-months-grid">${monthCards}</div>
          </div>
        `;
      }).join('');
    }

    async function loadManifest() {
      try {
        const resp = await fetch('/api/manifest');
        manifest = await resp.json();
        renderArchive();
      } catch (err) {
        console.error('Failed to load manifest:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadManifest();
    });
  </script>
</body>
</html>
